name: '[testnet] Deploy validator'

on: 
  push:
    branches: 
      - testnet

jobs:
  deploy_testnet_validator:
    uses: ./.github/workflows/testnet-validator-service.yaml
    with:
      SWR_ORGANIZATION: testnet-qubetics
      ARGOCD_BRANCH: testnet_v2
      HUAWEI_REGION: 'ap-southeast-3'
      ARGOCD_REPOSITORY: Qubetics/argocd-qubetics
      DEPLOYMENT_PATH: Validator/validator-deployment.yaml
      HUAWEI_IMAGE: testnet-validator
      DOCKER_USERNAME: ap-southeast-3@BQG9INQF0BKVHSNQOLJG
      ENV: ${{ vars.TESTNET_V2_VALIDATOR_ENV }}
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      GIT_SSH_KEY: ${{ secrets.ARGOCD_SSH_KEY }}
